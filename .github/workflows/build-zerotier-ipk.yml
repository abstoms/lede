name: Build luci-app-zerotier for OpenWRT 23.05 (X86)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPENWRT_VERSION: "23.05"
      TARGET_ARCH: "x86_64"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc \
            wget unzip python3 python3-distutils file

      - name: Clone OpenWRT source
        run: |
          git clone --depth 1 -b openwrt-${{ env.OPENWRT_VERSION }} https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          sed -i 's#https://git.openwrt.org/feed/#https://github.com/openwrt/#g' feeds.conf.default
          sed -i 's#https://git.openwrt.org/project/#https://github.com/openwrt/#g' feeds.conf.default

      - name: Add luci-app-zerotier source
        run: |
          cd openwrt
          git clone --depth 1 https://github.com/kenzok8/openwrt-packages.git package/kenzok8
          ln -s package/kenzok8/luci-app-zerotier package/luci-app-zerotier
          ln -s package/kenzok8/zerotier package/zerotier

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build options
        run: |
          cd openwrt
          make defconfig
          echo "CONFIG_PACKAGE_luci-app-zerotier=m" >> .config
          echo "CONFIG_PACKAGE_zerotier=m" >> .config
          make defconfig

      - name: Compile packages
        run: |
          cd openwrt
          make package/luci-app-zerotier/compile V=s -j$(nproc)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-zerotier-${{ env.OPENWRT_VERSION }}-${{ env.TARGET_ARCH }}
          path: |
            openwrt/bin/packages/${{ env.TARGET_ARCH }}/base/luci-app-zerotier_*.ipk
            openwrt/bin/packages/${{ env.TARGET_ARCH }}/base/zerotier_*.ipk
          retention-days: 30
